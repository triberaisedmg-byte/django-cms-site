services:
  # ------------------------------------------------------------------------------
  # Web Tier: Django CMS Marketing Application (Standalone Mode)
  # ------------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: tr-django-cms:standalone
    container_name: tr-django-cms-standalone
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DEBUG: "True"
      PORT: "8000"
      POSTGRES_HOST: ${STANDALONE_POSTGRES_HOST:-db}
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-triberaised_cms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${STANDALONE_POSTGRES_HOST:-db}:5432/${POSTGRES_DB:-triberaised_cms}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,[::1],web}
    ports:
      - "${PORT:-8001}:8000"
    volumes:
      - .:/app
      - cms_media:/app/media
      - cms_staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    networks:
      - standalone-network

  # ------------------------------------------------------------------------------
  # Database Tier: Local PostgreSQL 18 for Isolated Development
  # ------------------------------------------------------------------------------
  db:
    image: postgres:18-alpine
    container_name: tr-cms-standalone-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-triberaised_cms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${STANDALONE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - cms_standalone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-triberaised_cms}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - standalone-network

networks:
  standalone-network:
    driver: bridge

volumes:
  cms_standalone_pgdata:
  cms_media:
  cms_staticfiles:
