services:
  # ------------------------------------------------------------------------------
  # Web Tier: Django CMS Marketing Application
  # Attached to shared TribeRaised Docker Network (triberaised_tr-network)
  # Uses shared PostgreSQL 18 instance (tr-profile-postgres)
  # ------------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: tr-django-cms:latest
    container_name: tr-django-cms
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DEBUG: "True"
      PORT: "8000"
      POSTGRES_HOST: ${DOCKER_POSTGRES_HOST:-tr-profile-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-triberaised_cms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${DOCKER_POSTGRES_HOST:-tr-profile-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-triberaised_cms}}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,[::1],web}
      USE_GCS_MEDIA: ${USE_GCS_MEDIA:-False}
      GS_BUCKET_NAME: ${GS_BUCKET_NAME:-}
      USE_MINIO: ${USE_MINIO:-False}
    ports:
      - "${PORT:-8001}:8000"
    volumes:
      - .:/app
      - cms_media:/app/media
      - cms_staticfiles:/app/staticfiles
    command: >
      sh -c "python manage.py migrate &&
             exec python manage.py runserver 0.0.0.0:8000"
    networks:
      - tr-network

# ------------------------------------------------------------------------------
# Shared TribeRaised Bridge Network
# ------------------------------------------------------------------------------
networks:
  tr-network:
    name: triberaised_tr-network
    external: true

volumes:
  cms_media:
  cms_staticfiles:
