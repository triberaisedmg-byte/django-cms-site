<div class="bg-white dark:bg-night-850 rounded-2xl p-8 border border-slate-200 dark:border-night-750 shadow-sm relative overflow-hidden transition-all duration-200 hover:shadow-md">
    <!-- Sensory Ambient Accent -->
    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-calmTeal-500 via-brand-500 to-warmAmber-500"></div>

    <!-- Rating Stars -->
    <div class="flex items-center gap-1 text-warmAmber-400 mb-4" aria-label="{{ instance.rating_stars }} out of 5 stars">
        {% for _ in "12345"|slice:instance.rating_stars %}
        <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
        </svg>
        {% endfor %}
    </div>

    <!-- Quote Body -->
    <blockquote class="text-slate-700 dark:text-slate-200 text-base leading-relaxed mb-6 font-normal">
        “{{ instance.quote }}”
    </blockquote>

    <!-- Author Info -->
    <div class="flex items-center justify-between pt-4 border-t border-slate-100 dark:border-night-800">
        <div>
            <div class="font-bold text-slate-900 dark:text-white text-sm">
                {{ instance.author_name }}
            </div>
            {% if instance.author_role %}
            <div class="text-xs text-slate-500 dark:text-slate-400">
                {{ instance.author_role }}
            </div>
            {% endif %}
        </div>

        {% if instance.tag %}
        <span class="text-xs px-2.5 py-1 rounded-full font-medium bg-calmTeal-50 dark:bg-calmTeal-500/10 text-calmTeal-700 dark:text-calmTeal-300">
            {{ instance.tag }}
        </span>
        {% endif %}
    </div>
</div>
