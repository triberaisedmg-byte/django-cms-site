<section class="py-16 sm:py-20 transition-colors duration-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="relative overflow-hidden rounded-3xl p-8 sm:p-12 lg:p-16 text-center shadow-xl
            {% if instance.style == 'teal' %}
                bg-gradient-to-r from-calmTeal-700 via-calmTeal-600 to-sage-700 text-white
            {% elif instance.style == 'night' %}
                bg-gradient-to-r from-night-950 via-night-900 to-night-850 text-white border border-night-750
            {% else %}
                bg-gradient-to-r from-brand-700 via-brand-600 to-calmTeal-700 text-white
            {% endif %}">

            <!-- Decorative Glow Rings -->
            <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full bg-white/10 blur-2xl pointer-events-none" aria-hidden="true"></div>
            <div class="absolute -bottom-24 -right-24 w-96 h-96 rounded-full bg-white/10 blur-2xl pointer-events-none" aria-hidden="true"></div>

            <div class="relative max-w-3xl mx-auto">
                <h2 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold tracking-tight text-white mb-6">
                    {{ instance.headline }}
                </h2>

                <p class="text-base sm:text-xl text-white/90 mb-10 leading-relaxed font-light">
                    {{ instance.description }}
                </p>

                <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                    {% if instance.cta_text and instance.cta_url %}
                    <a
                        href="{{ instance.cta_url }}"
                        class="w-full sm:w-auto px-8 py-4 rounded-xl bg-white text-slate-900 hover:bg-slate-100 font-bold text-base shadow-lg hover:shadow-xl transition-all duration-200 transform hover:-translate-y-0.5"
                    >
                        {{ instance.cta_text }}
                    </a>
                    {% endif %}

                    {% if instance.secondary_cta_text and instance.secondary_cta_url %}
                    <a
                        href="{{ instance.secondary_cta_url }}"
                        class="w-full sm:w-auto px-8 py-4 rounded-xl border-2 border-white/40 hover:border-white text-white font-semibold text-base transition-colors duration-200"
                    >
                        {{ instance.secondary_cta_text }}
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</section>
