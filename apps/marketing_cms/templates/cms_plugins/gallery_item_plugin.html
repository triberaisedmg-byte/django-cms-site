<figure class="group relative rounded-2xl overflow-hidden bg-slate-100 dark:bg-night-850 border border-slate-200 dark:border-night-750 shadow-sm transition-all duration-300 hover:shadow-lg">
    <div class="aspect-w-16 aspect-h-10 w-full overflow-hidden">
        <img
            src="{{ instance.image_url }}"
            alt="{{ instance.alt_text|default:'TribeRaised Application' }}"
            loading="lazy"
            decoding="async"
            class="w-full h-64 object-cover object-top transition-transform duration-300 group-hover:scale-105"
            onerror="this.onerror=null; this.src='data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22400%22%20height%3D%22250%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%231E293B%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20fill%3D%22%2394A3B8%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20font-family%3D%22sans-serif%22%20font-size%3D%2216%22%3ETribeRaised%20Preview%3C%2Ftext%3E%3C%2Fsvg%3E';"
        />
    </div>

    {% if instance.badge or instance.caption %}
    <div class="p-4 bg-white/90 dark:bg-night-850/90 backdrop-blur-sm border-t border-slate-100 dark:border-night-800">
        {% if instance.badge %}
        <span class="inline-block text-[11px] font-semibold uppercase px-2 py-0.5 rounded bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-300 mb-1">
            {{ instance.badge }}
        </span>
        {% endif %}
        {% if instance.caption %}
        <figcaption class="text-sm font-medium text-slate-700 dark:text-slate-200">
            {{ instance.caption }}
        </figcaption>
        {% endif %}
    </div>
    {% endif %}
</figure>
