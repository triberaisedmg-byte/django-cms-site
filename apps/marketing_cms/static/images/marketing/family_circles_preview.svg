<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bgGrad4)" stroke="#1E293B" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="48" rx="16" fill="#1E293B" />
  <circle cx="28" cy="24" r="6" fill="#EF4444" opacity="0.8"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B" opacity="0.8"/>
  <circle cx="68" cy="24" r="6" fill="#10B981" opacity="0.8"/>
  <text x="400" y="30" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="500" text-anchor="middle">TribeRaised — Private Family Care Circles</text>

  <g transform="translate(100, 80)">
    <!-- Central Node -->
    <circle cx="300" cy="180" r="45" fill="#6366F1" fill-opacity="0.2" stroke="#6366F1" stroke-width="3"/>
    <text x="300" y="185" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Family Circle</text>

    <!-- Connector lines -->
    <line x1="300" y1="135" x2="150" y2="70" stroke="#1E293B" stroke-width="3" stroke-dasharray="6"/>
    <line x1="300" y1="135" x2="450" y2="70" stroke="#1E293B" stroke-width="3" stroke-dasharray="6"/>
    <line x1="300" y1="225" x2="150" y2="290" stroke="#1E293B" stroke-width="3" stroke-dasharray="6"/>
    <line x1="300" y1="225" x2="450" y2="290" stroke="#1E293B" stroke-width="3" stroke-dasharray="6"/>

    <!-- Nodes -->
    <rect x="75" y="40" width="150" height="60" rx="10" fill="#162032" stroke="#14B8A6" stroke-width="2"/>
    <text x="150" y="65" fill="#2DD4BF" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Parent / Caregiver</text>
    <text x="150" y="85" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Admin Controls</text>

    <rect x="375" y="40" width="150" height="60" rx="10" fill="#162032" stroke="#F59E0B" stroke-width="2"/>
    <text x="450" y="65" fill="#FCD34D" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Speech Therapist</text>
    <text x="450" y="85" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Limited Routine Access</text>

    <rect x="75" y="260" width="150" height="60" rx="10" fill="#162032" stroke="#10B981" stroke-width="2"/>
    <text x="150" y="285" fill="#4ADE80" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">School Aide</text>
    <text x="150" y="305" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Sensory Triggers Read-Only</text>

    <rect x="375" y="260" width="150" height="60" rx="10" fill="#162032" stroke="#818CF8" stroke-width="2"/>
    <text x="450" y="285" fill="#C7D2FE" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Grandparent</text>
    <text x="450" y="305" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Emergency Contacts</text>
  </g>
</svg>
