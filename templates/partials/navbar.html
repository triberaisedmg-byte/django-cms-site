<header class="w-full bg-white/95 dark:bg-night-900/95 backdrop-blur-md border-b border-slate-200 dark:border-night-750 sticky top-0 z-40 transition-colors duration-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between">
        <!-- Logo -->
        <a href="/" class="focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 rounded-lg p-1" aria-label="TribeRaised Home">
            {% include "partials/logo.html" with logo_width="38" logo_height="32" text_size="text-xl" %}
        </a>

        <!-- Desktop Navigation -->
        <nav class="hidden md:flex items-center space-x-7 text-sm font-medium text-slate-700 dark:text-slate-200" aria-label="Primary Navigation">
            <a href="/" class="hover:text-brand-600 dark:hover:text-brand-400 transition-colors py-1">Home</a>
            <a href="/about/" class="hover:text-brand-600 dark:hover:text-brand-400 transition-colors py-1">About Us</a>
            <a href="/solutions/" class="hover:text-brand-600 dark:hover:text-brand-400 transition-colors py-1">Solutions</a>
            <a href="https://forum.triberaised.com" target="_blank" rel="noopener noreferrer" class="hover:text-brand-600 dark:hover:text-brand-400 transition-colors py-1 flex items-center gap-1">
                Safe Forum
                <svg class="w-3.5 h-3.5 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            </a>
            <a href="/admin/" class="hover:text-brand-600 dark:hover:text-brand-400 transition-colors py-1 text-slate-500 dark:text-slate-400 text-xs">CMS Admin</a>
        </nav>

        <!-- Right Side: Dark Mode Toggle & CTAs -->
        <div class="hidden md:flex items-center space-x-4">
            <!-- Theme Toggle Button -->
            <button
                type="button"
                id="theme-toggle"
                class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-night-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 transition-colors"
                aria-label="Toggle dark mode"
            >
                <!-- Sun icon (shown in dark mode) -->
                <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <!-- Moon icon (shown in light mode) -->
                <svg id="theme-toggle-dark-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>

            <!-- Secondary CTA -->
            <a
                href="https://forum.triberaised.com"
                class="px-4 py-2 text-sm font-medium rounded-lg text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-night-750 hover:bg-slate-50 dark:hover:bg-night-800 transition-colors"
            >
                Visit Community
            </a>

            <!-- Primary CTA -->
            <a
                href="https://profile.triberaised.com"
                class="px-4 py-2 text-sm font-semibold rounded-lg bg-brand-500 hover:bg-brand-600 text-white shadow-sm hover:shadow transition-all duration-200"
            >
                Profile Portal
            </a>
        </div>

        <!-- Mobile Hamburger Button -->
        <div class="flex items-center space-x-2 md:hidden">
            <button
                type="button"
                id="mobile-theme-toggle"
                class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-night-800 focus:outline-none"
                aria-label="Toggle dark mode"
            >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
            </button>

            <button
                type="button"
                id="mobile-menu-button"
                class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-night-800 focus:outline-none focus:ring-2 focus:ring-brand-500"
                aria-controls="mobile-menu"
                aria-expanded="false"
                aria-label="Open main menu"
            >
                <svg id="mobile-menu-open-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <svg id="mobile-menu-close-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Mobile Navigation Drawer -->
    <div id="mobile-menu" class="hidden md:hidden border-t border-slate-200 dark:border-night-750 bg-white dark:bg-night-900 px-4 pt-3 pb-6 space-y-3">
        <a href="/" class="block px-3 py-2 rounded-lg text-base font-medium text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-night-800">Home</a>
        <a href="/about/" class="block px-3 py-2 rounded-lg text-base font-medium text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-night-800">About Us</a>
        <a href="/solutions/" class="block px-3 py-2 rounded-lg text-base font-medium text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-night-800">Solutions</a>
        <a href="https://forum.triberaised.com" target="_blank" rel="noopener noreferrer" class="block px-3 py-2 rounded-lg text-base font-medium text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-night-800">Safe Forum</a>
        <a href="/admin/" class="block px-3 py-2 rounded-lg text-sm text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-night-800">CMS Admin</a>
        <div class="pt-4 border-t border-slate-200 dark:border-night-750 flex flex-col gap-2">
            <a
                href="https://profile.triberaised.com"
                class="w-full text-center px-4 py-2.5 rounded-lg bg-brand-500 hover:bg-brand-600 text-white font-semibold shadow-sm"
            >
                Launch Profile Portal
            </a>
            <a
                href="https://forum.triberaised.com"
                class="w-full text-center px-4 py-2.5 rounded-lg border border-slate-300 dark:border-night-750 text-slate-700 dark:text-slate-200 font-medium hover:bg-slate-50 dark:hover:bg-night-800"
            >
                Visit Community Forum
            </a>
        </div>
    </div>
</header>
